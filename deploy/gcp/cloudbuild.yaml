steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/gcp/Dockerfile
      - --tag
      - ${_KIDE_IMAGE}
      - --build-arg
      - KIDE_BUILD_QUALIFIER=${_KIDE_QUALIFIER}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_KIDE_IMAGE}
images:
  - ${_KIDE_IMAGE}
substitutions:
  _REGION: asia-south1
  _AR_REPOSITORY: kide
  _KIDE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide:${BUILD_ID}'
  _KIDE_QUALIFIER: '${BUILD_ID}'
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
