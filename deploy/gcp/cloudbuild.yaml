steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Bootstrap Firebase hosted deployment
    entrypoint: bash
    args:
      - -ceu
      - |
        FIREBASE_PROJECT_ID="${_KIDE_FIREBASE_PROJECT_ID}"
        if [[ -z "$${FIREBASE_PROJECT_ID}" ]]; then
          FIREBASE_PROJECT_ID="${PROJECT_ID}"
        fi

        ADMIN_EMAIL="${_KIDE_FIREBASE_ADMIN_EMAIL}"
        PASSWORD_SECRET="${_KIDE_FIREBASE_ADMIN_PASSWORD_SECRET}"
        FIREBASE_ENV_FILE="/workspace/.kide-firebase.env"
        PASSWORD_FILE="/workspace/.kide-firebase-admin-password"

        gcloud services enable \
          run.googleapis.com \
          artifactregistry.googleapis.com \
          storage.googleapis.com \
          firebase.googleapis.com \
          identitytoolkit.googleapis.com \
          secretmanager.googleapis.com \
          --project "${PROJECT_ID}"
        BUILD_SERVICE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
        if [[ -z "$${BUILD_SERVICE_ACCOUNT}" ]]; then
          echo "Could not determine the active Cloud Build service account." >&2
          exit 2
        fi

        ensure_runtime_service_account() {
          local email="$1"
          local display_name="$2"
          local name="${email%%@*}"

          if ! gcloud iam service-accounts describe "${email}" \
              --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud iam service-accounts create "${name}" \
              --project "${PROJECT_ID}" \
              --display-name "${display_name}"
          fi

          if ! gcloud iam service-accounts add-iam-policy-binding "${email}" \
              --project "${PROJECT_ID}" \
              --member="serviceAccount:$${BUILD_SERVICE_ACCOUNT}" \
              --role="roles/iam.serviceAccountUser" >/dev/null; then
            echo "Cloud Build cannot grant iam.serviceAccounts.actAs on ${email}." >&2
            echo "Active build identity: $${BUILD_SERVICE_ACCOUNT}" >&2
            echo "Grant this build identity permission to manage the runtime service account IAM policy, then rerun the build." >&2
            exit 2
          fi
        }

        ensure_runtime_service_account "${_KIDE_RUNTIME_SA}" "KIDE backend runtime"
        ensure_runtime_service_account "${_KIDE_WEB_RUNTIME_SA}" "KIDE web runtime"

        if ! gcloud storage buckets describe "gs://${_KIDE_DATA_BUCKET}" \
            --project "${PROJECT_ID}" >/dev/null 2>&1; then
          gcloud storage buckets create "gs://${_KIDE_DATA_BUCKET}" \
            --project "${PROJECT_ID}" \
            --location "${_REGION}" \
            --uniform-bucket-level-access
        fi

        gcloud storage buckets add-iam-policy-binding "gs://${_KIDE_DATA_BUCKET}" \
          --project "${PROJECT_ID}" \
          --member="serviceAccount:${_KIDE_RUNTIME_SA}" \
          --role="roles/storage.objectUser" >/dev/null

        echo "KIDE data bucket and runtime storage access are ready."

        echo "Cloud Build runtime identity bindings are ready."
        echo "Build service account: $${BUILD_SERVICE_ACCOUNT}"

        umask 077
        if gcloud secrets describe "$${PASSWORD_SECRET}" \
            --project "${PROJECT_ID}" >/dev/null 2>&1; then
          gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret "$${PASSWORD_SECRET}" \
            > "$${PASSWORD_FILE}"
          echo "Reusing Firebase administrator password from Secret Manager."
        else
          python3 - <<'PY' > /workspace/.kide-firebase-admin-password
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          gcloud secrets create "$${PASSWORD_SECRET}" \
            --project "${PROJECT_ID}" \
            --replication-policy=automatic \
            --data-file="$${PASSWORD_FILE}" >/dev/null
          echo "Created Firebase administrator password secret '$${PASSWORD_SECRET}'."
        fi

        export KIDE_FIREBASE_PROJECT_ID="$${FIREBASE_PROJECT_ID}"
        export KIDE_FIREBASE_ADMIN_EMAIL="$${ADMIN_EMAIL}"
        export KIDE_FIREBASE_ADMIN_PASSWORD_FILE="$${PASSWORD_FILE}"
        if [[ -n "${_KIDE_FIREBASE_ADMIN_UID}" ]]; then
          export KIDE_FIREBASE_ADMIN_UID="${_KIDE_FIREBASE_ADMIN_UID}"
        else
          unset KIDE_FIREBASE_ADMIN_UID || true
        fi

        python3 scripts/bootstrap_firebase_auth.py \
          --project-id "$${FIREBASE_PROJECT_ID}" \
          --output "$${FIREBASE_ENV_FILE}"

        source "$${FIREBASE_ENV_FILE}"
        test -n "$${KIDE_FIREBASE_API_KEY}"
        test -n "$${KIDE_FIREBASE_ADMIN_UID}"

        echo "Firebase hosted deployment configuration is ready."
        echo "Firebase project: $${KIDE_FIREBASE_PROJECT_ID}"
        echo "Firebase administrator UID: $${KIDE_FIREBASE_ADMIN_UID}"

  - name: maven:3.9.9-eclipse-temurin-21
    id: Build Eclipse desktop products
    entrypoint: bash
    args:
      - -ceu
      - |
        mvn -B -ntp clean verify

  - name: python:3.12-slim
    id: Stage Eclipse release bundles
    entrypoint: bash
    args:
      - -ceu
      - |
        rm -rf dist
        python3 scripts/prepare_desktop_release.py \
          --products releng/com.kide.repository/target/products \
          --output dist \
          --version "gcp-${SHORT_SHA}"

        python3 - <<'PY'
        import json
        import tarfile
        import zipfile
        from pathlib import Path

        dist = Path("dist")
        manifest = json.loads((dist / "release-manifest.json").read_text())
        expected = {
            "windows-x86_64": "KIDE.exe",
            "linux-x86_64": "KIDE.sh",
            "macos-x86_64": "KIDE.command",
            "macos-aarch64": "KIDE.command",
        }

        seen = set()
        for artifact in manifest["artifacts"]:
            platform = artifact["platform"]
            seen.add(platform)
            entry = artifact["entryPoint"]
            assert entry.endswith(expected[platform]), (platform, entry)
            archive = dist / artifact["file"]
            if archive.suffix == ".zip":
                with zipfile.ZipFile(archive) as zf:
                    assert entry in zf.namelist(), (platform, entry)
            else:
                with tarfile.open(archive, "r:gz") as tf:
                    member = tf.getmember(entry)
                    assert member.mode & 0o111, (platform, entry, oct(member.mode))

        assert seen == set(expected), seen
        print("Qualified Eclipse desktop bundles:", sorted(seen))
        PY

  - name: gcr.io/cloud-builders/docker
    id: Build KIDE backend image
    args:
      - build
      - --file
      - deploy/gcp/Dockerfile
      - --tag
      - ${_KIDE_IMAGE}
      - --build-arg
      - KIDE_BUILD_QUALIFIER=${SHORT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push KIDE backend image
    args:
      - push
      - ${_KIDE_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Deploy KIDE backend
    entrypoint: bash
    args:
      - -ceu
      - |
        source /workspace/.kide-firebase.env

        gcloud run deploy "${_KIDE_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --image "${_KIDE_IMAGE}" \
          --service-account "${_KIDE_RUNTIME_SA}" \
          --allow-unauthenticated \
          --ingress all \
          --default-url \
          --port 8080 \
          --startup-probe "httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=10,failureThreshold=60" \
          --cpu-boost \
          --cpu 2 \
          --memory 4Gi \
          --concurrency 20 \
          --timeout 3600s \
          --min 1 \
          --max 1 \
          --session-affinity \
          --add-volume "mount-path=/data,type=cloud-storage,bucket=${_KIDE_DATA_BUCKET},readonly=false,mount-options=uid=10001;gid=10001" \
          --set-env-vars "^|^KIDE_FIREBASE_PROJECT_ID=$${KIDE_FIREBASE_PROJECT_ID}|KIDE_FIREBASE_ADMIN_UID=${KIDE_FIREBASE_ADMIN_UID}|KIDE_FIREBASE_ENGINEER_UIDS=${_KIDE_FIREBASE_ENGINEER_UIDS}" \
          --labels "kide-component=backend,kide-build-id=${BUILD_ID}" \
          --quiet

        BACKEND_URL="$(gcloud run services describe "${_KIDE_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --format='value(status.url)')"

        test -n "$${BACKEND_URL}"
        printf '%s' "$${BACKEND_URL}" > /workspace/.kide-backend-url
        echo "KIDE backend deployed: $${BACKEND_URL}"

  - name: gcr.io/cloud-builders/docker
    id: Build KIDE web image
    entrypoint: sh
    args:
      - -ceu
      - |
        BACKEND_URL="$(cat /workspace/.kide-backend-url)"
        . /workspace/.kide-firebase.env

        docker build \
          --file deploy/web/Dockerfile \
          --tag "${_KIDE_WEB_IMAGE}" \
          --build-arg "VITE_KIDE_API_ORIGIN=$${BACKEND_URL}" \
          --build-arg "VITE_KIDE_LSP_ORIGIN=$${BACKEND_URL}" \
          --build-arg "VITE_FIREBASE_API_KEY=$${KIDE_FIREBASE_API_KEY}" \
          --build-arg "VITE_FIREBASE_PROJECT_ID=$${KIDE_FIREBASE_PROJECT_ID}" \
          --build-arg "VITE_KIDE_WEB_BUILD_ID=${SHORT_SHA}" \
          .

  - name: gcr.io/cloud-builders/docker
    id: Push KIDE web image
    args:
      - push
      - ${_KIDE_WEB_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Deploy KIDE web
    entrypoint: bash
    args:
      - -ceu
      - |
        BACKEND_URL="$(cat /workspace/.kide-backend-url)"

        gcloud run deploy "${_KIDE_WEB_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --image "${_KIDE_WEB_IMAGE}" \
          --service-account "${_KIDE_WEB_RUNTIME_SA}" \
          --allow-unauthenticated \
          --ingress all \
          --default-url \
          --port 8080 \
          --cpu 1 \
          --memory 512Mi \
          --concurrency 80 \
          --timeout 300s \
          --min 0 \
          --max 10 \
          --labels "kide-component=web,kide-build-id=${BUILD_ID}" \
          --quiet

        WEB_URL="$(gcloud run services describe "${_KIDE_WEB_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --format='value(status.url)')"

        test -n "$${WEB_URL}"
        printf '%s' "$${WEB_URL}" > /workspace/.kide-web-url

        gcloud run services update "${_KIDE_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --update-env-vars "^|^KIDE_ALLOWED_ORIGINS=$${BACKEND_URL},$${WEB_URL}" \
          --quiet

        BACKEND_URL="$(gcloud run services describe "${_KIDE_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --format='value(status.url)')"
        test -n "$${BACKEND_URL}"
        printf '%s' "$${BACKEND_URL}" > /workspace/.kide-backend-url

        echo "KIDE web deployed: $${WEB_URL}"
        echo "KIDE backend: $${BACKEND_URL}"
        echo "Cloud Run backend routing:"
        gcloud run services describe "${_KIDE_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --format='yaml(status.url,status.latestReadyRevisionName,status.traffic)'
        echo "Cloud Run web routing:"
        gcloud run services describe "${_KIDE_WEB_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --format='yaml(status.url,status.latestReadyRevisionName,status.traffic)'

  - name: curlimages/curl:8.12.1
    id: Verify live KIDE deployment
    entrypoint: sh
    args:
      - -ceu
      - |
        BACKEND_URL="$(cat /workspace/.kide-backend-url)"
        WEB_URL="$(cat /workspace/.kide-web-url)"

        check_url() {
          name="$1"
          url="$2"
          body_file="$3"
          attempts=13
          attempt=1

          while [ "${attempt}" -le "${attempts}" ]; do
            if status="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --output "${body_file}" \
                --write-out '%{http_code}' \
                "${url}")"; then
              case "${status}" in
                2??|3??)
                  echo "${name}: HTTP ${status} ${url}"
                  return 0
                  ;;
              esac
            else
              status=000
            fi

            echo "${name}: attempt ${attempt}/${attempts} returned HTTP ${status} from ${url}" >&2
            if [ "${attempt}" -lt "${attempts}" ]; then
              sleep 5
            fi
            attempt=$((attempt + 1))
          done

          echo "${name} verification failed: ${url}" >&2
          echo "Last HTTP status: ${status}" >&2
          echo "Response body (first 2048 bytes):" >&2
          head -c 2048 "${body_file}" >&2 || true
          echo >&2
          return 1
        }

        check_url "KIDE backend root" "$${BACKEND_URL}/" /tmp/kide-backend-root
        grep -q '"service":"kide-backend"' /tmp/kide-backend-root

        check_url "KIDE backend health" "$${BACKEND_URL}/health" /tmp/kide-backend-health
        grep -q '"status":"UP"' /tmp/kide-backend-health

        check_url "KIDE API health" "$${BACKEND_URL}/api/v1/health" /tmp/kide-api-health
        grep -q '"status":"UP"' /tmp/kide-api-health

        check_url "KIDE API version" "$${BACKEND_URL}/api/v1/version" /tmp/kide-api-version
        grep -q '"buildId":"${SHORT_SHA}"' /tmp/kide-api-version

        check_url "KIDE web health" "$${WEB_URL}/health" /tmp/kide-web-health

        check_url "KIDE web build identity" "$${WEB_URL}/kide-version.json" /tmp/kide-web-version
        grep -q '"buildId":"${SHORT_SHA}"' /tmp/kide-web-version

        check_url "KIDE web root" "$${WEB_URL}/" /tmp/kide-web-root
        grep -q '<div id="root"></div>' /tmp/kide-web-root

        echo "KIDE DEPLOYMENT COMPLETE"
        echo "Web: $${WEB_URL}"
        echo "Backend: $${BACKEND_URL}"

  - name: python:3.12-slim
    id: Write hosted deployment metadata
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import json
        from pathlib import Path

        dist = Path("/workspace/dist")
        web_url = Path("/workspace/.kide-web-url").read_text().strip()
        backend_url = Path("/workspace/.kide-backend-url").read_text().strip()

        hosted = (
            f"KIDE web: {web_url}\n"
            f"KIDE backend: {backend_url}\n"
            f"Web health: {web_url}/health\n"
            f"Backend health: {backend_url}/health\n"
        )
        (dist / "KIDE-HOSTED-URL.txt").write_text(hosted, encoding="utf-8")

        manifest = {
            "schemaVersion": 1,
            "repository": "${_KIDE_GITHUB_REPOSITORY}",
            "commit": "${COMMIT_SHA}",
            "cloudBuildId": "${BUILD_ID}",
            "region": "${_REGION}",
            "webService": "${_KIDE_WEB_SERVICE_NAME}",
            "webUrl": web_url,
            "backendService": "${_KIDE_SERVICE_NAME}",
            "backendUrl": backend_url,
            "backendImage": "${_KIDE_IMAGE}",
            "webImage": "${_KIDE_WEB_IMAGE}",
        }
        (dist / "gcp-deployment-manifest.json").write_text(
            json.dumps(manifest, indent=2) + "\n",
            encoding="utf-8",
        )

        notes = (
            "# KIDE GCP build ${SHORT_SHA}\n\n"
            f"**Hosted web application:** {web_url}\n\n"
            f"**Backend:** {backend_url}\n\n"
            "This pre-release was built and deployed by Google Cloud Build from commit\n"
            "${COMMIT_SHA}.\n\n"
            "The attached desktop bundles contain the Windows, Linux, macOS Intel, and\n"
            "macOS Apple Silicon Eclipse products built in the same Cloud Build execution.\n"
            "They are unsigned CI/pre-release bundles and remain separate from the trusted\n"
            "signed/notarized production release workflow.\n"
        )
        (dist / "gcp-release-notes.md").write_text(notes, encoding="utf-8")
        print(hosted)
        PY

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Resolve GitHub release token
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_KIDE_RELEASE_ENABLED}" != "true" ]; then
          echo "Skipping GitHub token resolution: GitHub Release publication is not enabled."
          exit 0
        fi

        umask 077
        gcloud secrets versions access latest \
          --project "${PROJECT_ID}" \
          --secret "${_KIDE_GITHUB_TOKEN_SECRET}" \
          > /workspace/.kide-github-token

  - name: python:3.12-slim
    id: Publish desktop builds and hosted URL to GitHub Releases
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ "${_KIDE_RELEASE_ENABLED}" != "true" ]; then
          echo "Skipping GitHub Release publication: publication is not enabled."
          exit 0
        fi

        test -s dist/gcp-release-notes.md || {
          echo "Hosted release metadata is missing: dist/gcp-release-notes.md" >&2
          echo "The hosted deployment metadata step must complete before release publication." >&2
          exit 2
        }
        test -s dist/KIDE-HOSTED-URL.txt || {
          echo "Hosted URL asset is missing: dist/KIDE-HOSTED-URL.txt" >&2
          exit 2
        }
        test -s dist/gcp-deployment-manifest.json || {
          echo "Deployment manifest is missing: dist/gcp-deployment-manifest.json" >&2
          exit 2
        }
        test -s /workspace/.kide-github-token || {
          echo "GitHub release token was not resolved." >&2
          exit 2
        }

        python3 scripts/publish_github_release.py \
          --repository "${_KIDE_GITHUB_REPOSITORY}" \
          --tag "gcp-${SHORT_SHA}" \
          --title "KIDE GCP Build ${SHORT_SHA}" \
          --target "${COMMIT_SHA}" \
          --notes dist/gcp-release-notes.md \
          --token-file /workspace/.kide-github-token \
          --asset-glob 'dist/KIDE-*.zip' \
          --asset-glob 'dist/KIDE-*.tar.gz' \
          --asset-glob dist/release-manifest.json \
          --asset-glob dist/SHA256SUMS.txt \
          --asset-glob dist/KIDE-HOSTED-URL.txt \
          --asset-glob dist/gcp-deployment-manifest.json

images:
  - ${_KIDE_IMAGE}
  - ${_KIDE_WEB_IMAGE}

substitutions:
  _KIDE_RELEASE_ENABLED: 'false'
  _REGION: asia-south1
  _AR_REPOSITORY: kide
  _KIDE_SERVICE_NAME: kide
  _KIDE_WEB_SERVICE_NAME: kide-web
  _KIDE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide:${BUILD_ID}'
  _KIDE_WEB_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide-web:${BUILD_ID}'
  _KIDE_DATA_BUCKET: '${PROJECT_ID}-kide-data'
  _KIDE_RUNTIME_SA: 'kide-runtime@${PROJECT_ID}.iam.gserviceaccount.com'
  _KIDE_WEB_RUNTIME_SA: 'kide-web-runtime@${PROJECT_ID}.iam.gserviceaccount.com'
  _KIDE_FIREBASE_PROJECT_ID: '${PROJECT_ID}'
  _KIDE_FIREBASE_ADMIN_EMAIL: 'kide-admin@${PROJECT_ID}.firebaseapp.com'
  _KIDE_FIREBASE_ADMIN_PASSWORD_SECRET: 'kide-firebase-admin-password'
  _KIDE_FIREBASE_ADMIN_UID: ''
  _KIDE_FIREBASE_ENGINEER_UIDS: ''
  _KIDE_GITHUB_REPOSITORY: 'amarbanerjee23/KIDE'
  _KIDE_GITHUB_TOKEN_SECRET: 'kide-github-release-token'


timeout: 7200s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
