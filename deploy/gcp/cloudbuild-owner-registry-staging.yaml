# PR111: separate Git-push candidate path for verified-email owner-only projects.
# DO NOT retarget the production trigger to this file. Staging only, no traffic.
# The normal cloudbuild.yaml deliberately keeps legacy GCS FUSE mode isolated.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Validate private-registry staging approval
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_STAGING_APPROVAL}" != isolated-staging-only ||
              "${_STORAGE_PREFLIGHT_APPROVAL}" != staging-only-offline ]]; then
          echo "Refusing Git-push owner-only deployment without staging and offline NFS qualification approvals" >&2
          exit 2
        fi
        if [[ "${_STAGING_SERVICE}" != *-registry-staging ||
              "${_STAGING_SERVICE}" == kide ||
              -z "${_STAGING_FIREBASE_PROJECT_ID}" ||
              -z "${_STAGING_RUNTIME_SA}" ||
              -z "${_STAGING_NFS_IP}" ||
              -z "${_STAGING_NFS_EXPORT}" ||
              -z "${_STAGING_VPC_NETWORK}" ||
              -z "${_STAGING_VPC_SUBNET}" ||
              ! "${_STAGING_WEB_ORIGIN}" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
          echo "Staging-only Firebase, NFS, VPC, runtime identity, HTTPS origin and safe service name required" >&2
          exit 2
        fi
        if [[ -z "${COMMIT_SHA}" || ! "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "A full immutable source SHA from the Git-push trigger is required" >&2
          exit 2
        fi

  - name: gcr.io/cloud-builders/docker
    id: Build source-pinned registry backend
    args:
      - build
      - --file
      - deploy/gcp/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide-registry:${COMMIT_SHA}
      - --build-arg
      - KIDE_BUILD_QUALIFIER=${COMMIT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push source-pinned registry backend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide-registry:${COMMIT_SHA}

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Deploy isolated no-traffic owner-only staging revision
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide-registry:${COMMIT_SHA}"
        digest="$(gcloud artifacts docker images describe "$${image}" \
          --project "${PROJECT_ID}" --format='value(image_summary.digest)')"
        if ! [[ "$${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Artifact Registry did not confirm a pinned image digest; refusing deploy" >&2
          exit 2
        fi
        export PROJECT_ID="${PROJECT_ID}"
        export REGION="${_REGION}"
        export STAGING_SERVICE="${_STAGING_SERVICE}"
        export STAGING_BACKEND_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide-registry@$${digest}"
        export STAGING_FIREBASE_PROJECT_ID="${_STAGING_FIREBASE_PROJECT_ID}"
        export STAGING_RUNTIME_SA="${_STAGING_RUNTIME_SA}"
        export NFS_IP="${_STAGING_NFS_IP}"
        export NFS_EXPORT="${_STAGING_NFS_EXPORT}"
        export VPC_NETWORK="${_STAGING_VPC_NETWORK}"
        export VPC_SUBNET="${_STAGING_VPC_SUBNET}"
        export STAGING_WEB_ORIGIN="${_STAGING_WEB_ORIGIN}"
        export DEPLOY_APPROVAL="${_STAGING_APPROVAL}"
        export STORAGE_PREFLIGHT_APPROVAL="${_STORAGE_PREFLIGHT_APPROVAL}"
        export STAGING_UPDATE_APPROVAL="${_STAGING_UPDATE_APPROVAL}"
        bash deploy/gcp/deploy-registry-staging.sh

substitutions:
  _REGION: asia-south1
  _AR_REPOSITORY: kide
  _STAGING_APPROVAL: disabled
  _STORAGE_PREFLIGHT_APPROVAL: disabled
  _STAGING_UPDATE_APPROVAL: disabled
  _STAGING_SERVICE: ''
  _STAGING_FIREBASE_PROJECT_ID: ''
  _STAGING_RUNTIME_SA: ''
  _STAGING_NFS_IP: ''
  _STAGING_NFS_EXPORT: ''
  _STAGING_VPC_NETWORK: ''
  _STAGING_VPC_SUBNET: ''
  _STAGING_WEB_ORIGIN: ''

timeout: 7200s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
