name: KIDE Enterprise CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PR109: Previous jobs reported success while both legacy kide-enterprise/
# directories were absent. The real Java backend executes in Build KIDE, and
# these jobs now run actual policy/API tests and the actual web/ frontend.
jobs:
  backend-test:
    name: Engineering Backend Policy and API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Require actual Java backend contract and policy tests
        shell: bash
        run: |
          set -euo pipefail
          test -f com.kide.enterprise.server/src/com/kide/enterprise/server/EnterpriseApiServer.java
          test -f com.kide.enterprise.authorization.tests/src/com/kide/enterprise/authorization/tests/AuthorizationServiceTest.java
          test -f scripts/tests/test_hosted_connectivity.py
          test -f scripts/tests/test_pr107_release_candidate.py
          echo 'Java/Eclipse backend runtime tests are mandatory in Build KIDE; policy and integration contracts run here.'

      - name: Test repository security, hosted service and API contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify packaged authorization, LSP, GLSP and release boundaries
        run: |
          python3 scripts/verify_shared_firebase_access.py
          python3 scripts/verify_lsp_parity_matrix.py
          python3 scripts/verify_diagram_parity.py
          python3 scripts/verify_live_acceptance.py
          python3 scripts/verify_pr107_release_gate.py

  frontend-build:
    name: Web Frontend Typecheck, Unit Tests and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Require actual Web engineering application
        shell: bash
        run: |
          set -euo pipefail
          test -f web/src/App.tsx
          test -f web/src/lspClient.ts
          test -f web/src/glspClient.ts
          test -f web/src/collaboration.ts

      - name: Install Web dependencies from pinned package versions
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Run actual Web unit tests
        working-directory: web
        run: npm run test

      - name: Typecheck and build actual production Web frontend
        working-directory: web
        run: npm run build

      - name: Require real deployed acceptance tests to be discoverable
        working-directory: web
        run: |
          npx playwright test --config playwright.live.config.ts --list
          npx playwright test --config playwright.connectivity.config.ts --list
