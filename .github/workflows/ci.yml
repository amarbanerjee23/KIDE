name: KIDE Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  eclipse-product-build:
    name: Eclipse Product / Portable Desktop Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Eclipse plug-ins and desktop products
        run: mvn -B -ntp clean verify

      - name: Qualify portable Windows, Linux and macOS archives
        run: |
          python3 scripts/prepare_desktop_release.py \
            --products releng/com.kide.repository/target/products

      - name: Upload qualified desktop products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kide-desktop-products
          path: |
            releng/com.kide.repository/target/products/*.zip
            releng/com.kide.repository/target/products/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd kide-enterprise/backend
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite httpx pytest pytest-asyncio passlib bcrypt python-jose python-multipart

      - name: Run Pytest Suite
        run: |
          cd kide-enterprise/backend
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd kide-enterprise/frontend
          npm install

      - name: Run TypeScript Check & Vite Build
        run: |
          cd kide-enterprise/frontend
          npm run build
