name: KIDE Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd kide-enterprise/backend
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite httpx pytest pytest-asyncio passlib bcrypt python-jose python-multipart
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd kide-enterprise/backend
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Production Build
    name: Frontend Tests, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd kide-enterprise/frontend
          npm install

      - name: Run Frontend Tests
        run: |
          cd kide-enterprise/frontend
          npm test

      - name: Run TypeScript Check & Vite Build
        run: |
          cd kide-enterprise/frontend
          npm run build


