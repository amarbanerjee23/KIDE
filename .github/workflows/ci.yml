name: KIDE Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect backend component
        id: backend
        shell: bash
        run: |
          if [ -d kide-enterprise/backend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend component is not present on this branch; Eclipse-only changes do not require the split web backend."
          fi

      - name: Set up Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        if: steps.backend.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          cd kide-enterprise/backend
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite httpx pytest pytest-asyncio passlib bcrypt python-jose python-multipart

      - name: Run Pytest Suite
        if: steps.backend.outputs.present == 'true'
        run: |
          cd kide-enterprise/backend
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect frontend component
        id: frontend
        shell: bash
        run: |
          if [ -d kide-enterprise/frontend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Frontend component is not present on this branch; Eclipse-only changes do not require the split web frontend."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        if: steps.frontend.outputs.present == 'true'
        run: |
          cd kide-enterprise/frontend
          npm install

      - name: Run TypeScript Check & Vite Build
        if: steps.frontend.outputs.present == 'true'
        run: |
          cd kide-enterprise/frontend
          npm run build
