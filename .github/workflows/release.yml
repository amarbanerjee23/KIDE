name: Release KIDE

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this build can be signed
        id: signing
        env:
          KIDE_KEY_ALIAS: ${{ secrets.KIDE_KEY_ALIAS }}
          KIDE_KEYSTORE_PATH: ${{ secrets.KIDE_KEYSTORE_PATH }}
        run: |
          if [ -n "$KIDE_KEY_ALIAS" ] && [ -n "$KIDE_KEYSTORE_PATH" ]; then
            echo "profile=-Psign" >> "$GITHUB_OUTPUT"
          else
            echo "profile=" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured - producing an unsigned release."
          fi

      - name: Build Eclipse product
        env:
          KIDE_KEYSTORE: ${{ secrets.KIDE_KEYSTORE_PATH }}
          KIDE_KEY_ALIAS: ${{ secrets.KIDE_KEY_ALIAS }}
          KIDE_KEYSTORE_PASSWORD: ${{ secrets.KIDE_KEYSTORE_PASSWORD }}
        run: mvn -B -ntp clean verify ${{ steps.signing.outputs.profile }}

      - name: Qualify and stage standalone desktop products
        run: |
          rm -rf dist
          python3 scripts/prepare_desktop_release.py \
            --products releng/com.kide.repository/target/products \
            --output dist \
            --version "${{ steps.version.outputs.value }}"

      - name: Add Eclipse update-site archive
        run: |
          (cd releng/com.kide.repository/target/repository && zip -qr "$GITHUB_WORKSPACE/dist/kide-p2-repository.zip" .)
          (cd dist && sha256sum kide-p2-repository.zip >> SHA256SUMS.txt)
          sort -k2 -o dist/SHA256SUMS.txt dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          ls -lah dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## KIDE Modelling Studio

            ### Standalone desktop application
            Download the archive for your platform and unpack it. **No separate
            Java installation is required**; every archive contains the tested
            JustJ/Adoptium Java runtime used by KIDE.

            - Windows x64: run `kide.exe`
            - Linux x64: run `./kide`
            - macOS Intel / Apple silicon: open `KIDE.app`

            Verify the download against `SHA256SUMS.txt`. The accompanying
            `release-manifest.json` records the qualified launcher, embedded
            runtime and digest for each platform artifact.

            ### Existing Eclipse installation
            Help > Install New Software > Add > Archive, choose
            `kide-p2-repository.zip`, then install *KIDE Modelling Tools*.

            See `docs/installation.md` for full instructions and platform notes.

      - name: Publish the update site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: releng/com.kide.repository/target/repository
          destination_dir: updates
          keep_files: true
