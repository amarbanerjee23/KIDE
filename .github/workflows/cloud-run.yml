name: KIDE Cloud Run Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/gcp/**'
      - 'com.kide.glsp/**'
      - 'com.kide.enterprise.server/**'
      - 'com.kide.languageserver.gateway/**'
      - 'web/**'
      - 'pom.xml'
      - 'releng/com.kide.languageserver.feature/**'
      - '.github/workflows/cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and boot Cloud Run image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Cloud Run image
        run: docker build --file deploy/gcp/Dockerfile --build-arg KIDE_BUILD_QUALIFIER=ci${GITHUB_SHA:0:12} --tag kide-cloud-run:ci .

      - name: Boot Cloud Run image
        run: |
          set -euo pipefail
          container_id="$(docker run -d             -p 18080:8080             -e PORT=8080             -e KIDE_OIDC_INTROSPECTION_URL=https://127.0.0.1:19999/introspect             -e KIDE_OIDC_CLIENT_ID=kide-ci             -e KIDE_OIDC_CLIENT_SECRET=ci-only-placeholder             -e KIDE_OIDC_ISSUER=https://issuer.example.test/             -e KIDE_OIDC_AUDIENCE=kide-ci             -e KIDE_PRIMARY_PRINCIPAL=ci:administrator             kide-cloud-run:ci)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id"                 2>/dev/null | grep -qx true; then
              echo "Cloud Run image exited before readiness" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "Cloud Run image did not become healthy" >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18080/ |             grep -q '<div id="root"></div>'
          docker logs "$container_id" 2>&1 |             grep -q 'KIDE CLOUD RUN READY'
