name: KIDE Cloud Run Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/gcp/**'
      - 'deploy/web/**'
      - 'com.kide.glsp/**'
      - 'com.kide.enterprise.server/**'
      - 'com.kide.languageserver.gateway/**'
      - 'web/**'
      - 'pom.xml'
      - 'releng/com.kide.languageserver.feature/**'
      - '.github/workflows/cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and boot Cloud Run image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Cloud Run image
        run: docker build --file deploy/gcp/Dockerfile --build-arg KIDE_BUILD_QUALIFIER=ci${GITHUB_SHA:0:12} --tag kide-cloud-run:ci .

      - name: Boot Cloud Run image
        run: |
          set -euo pipefail
          container_id="$(docker run -d             -p 18080:8080             -e PORT=8080             -e KIDE_FIREBASE_PROJECT_ID=kide-ci \
            -e KIDE_FIREBASE_ADMIN_UID=ci-administrator             kide-cloud-run:ci)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id"                 2>/dev/null | grep -qx true; then
              echo "Cloud Run image exited before readiness" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "Cloud Run image did not become healthy" >&2
            exit 1
          fi

          root_body="$(curl --fail --silent http://127.0.0.1:18080/)"
          if ! grep -q '"service":"kide-backend"' <<< "$root_body"; then
            echo "Backend root did not return the KIDE service status document" >&2
            exit 1
          fi
          fully_ready=0
          for _ in $(seq 1 120); do
            container_logs="$(docker logs "$container_id" 2>&1)"
            if grep -q 'KIDE CLOUD RUN READY' <<< "$container_logs"; then
              fully_ready=1
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id" \
                2>/dev/null | grep -qx true; then
              echo "Cloud Run image exited before full KIDE readiness" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$fully_ready" -ne 1 ]]; then
            echo "Cloud Run image became healthy but did not reach full KIDE readiness" >&2
            exit 1
          fi


      - name: Build standalone web image
        run: |
          docker build \
            --file deploy/web/Dockerfile \
            --build-arg VITE_KIDE_API_ORIGIN=https://backend.example.test \
            --build-arg VITE_KIDE_LSP_ORIGIN=https://backend.example.test \
            --tag kide-web:ci \
            .

      - name: Boot standalone web image
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 18090:8080 -e PORT=8080 kide-web:ci)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' "$container_id" \
                2>/dev/null | grep -qx true; then
              echo "Standalone web image exited before readiness" >&2
              exit 1
            fi
            sleep 1
          done

          test "$ready" -eq 1
          curl --fail --silent http://127.0.0.1:18090/ | grep -q '<div id="root"></div>'
