name: Build KIDE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Retain build artifacts in GitHub Actions storage'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Eclipse Plug-ins and Portable Products
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build timestamp comes from git history

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache the p2 target platform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/.cache/tycho
          key: tycho-${{ hashFiles('releng/com.kide.target/com.kide.target.target') }}
          restore-keys: tycho-

      - name: Test repository governance checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Enforce immutable GitHub Actions pins
        run: python3 scripts/verify_workflow_pins.py

      - name: Enforce shared Xtext language layers
        run: python3 scripts/verify_language_layering.py

      - name: Verify shipped language product truth
        run: python3 scripts/verify_product_truth.py

      - name: Verify LSP feature parity matrix
        run: python3 scripts/verify_lsp_parity_matrix.py

      - name: Verify Xtext modernization contract
        run: python3 scripts/verify_xtext_modernization.py

      - name: Verify PR16 current platform contract
        run: python3 scripts/verify_platform_upgrade.py

      - name: Build Eclipse plug-ins and portable products
        run: |
          set +e
          mvn -B -ntp clean verify
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Tycho/Equinox failure diagnostics"
            find com.kide.enterprise.context.tests/target -type f \( -name '*.log' -o -name '.log' \) -print -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \; 2>/dev/null || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Qualify standalone Windows, Linux and macOS desktop products
        run: |
          python3 scripts/prepare_desktop_release.py \
            --products releng/com.kide.repository/target/products

      - name: Smoke-test packaged enterprise context runtime
        run: |
          python3 scripts/smoke_enterprise_context.py \
            --products releng/com.kide.repository/target/products

      - name: Smoke-test packaged project schema migration
        run: |
          python3 scripts/smoke_schema_migration.py \
            --products releng/com.kide.repository/target/products

      - name: Smoke-test headless multi-DSL language server
        run: |
          python3 scripts/smoke_language_server.py \
            --products releng/com.kide.languageserver.repository/target/products

      - name: Qualify packaged LSP feature parity
        run: |
          python3 scripts/qualify_lsp_parity.py \
            --products releng/com.kide.languageserver.repository/target/products

      - name: Upload update site
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kide-p2-repository
          path: releng/com.kide.repository/target/repository
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop products
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kide-products
          path: |
            releng/com.kide.repository/target/products/*.zip
            releng/com.kide.repository/target/products/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Upload language-server products
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kide-language-server-products
          path: |
            releng/com.kide.languageserver.repository/target/products/*.zip
            releng/com.kide.languageserver.repository/target/products/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
