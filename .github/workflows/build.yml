name: Build KIDE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Eclipse Plug-ins and Portable Products
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build timestamp comes from git history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache the p2 target platform
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/.cache/tycho
          key: tycho-${{ hashFiles('releng/com.kide.target/com.kide.target.target') }}
          restore-keys: tycho-

      - name: Build Eclipse plug-ins and desktop products
        run: mvn -B -ntp clean verify

      - name: Qualify standalone Windows, Linux and macOS products
        run: |
          python3 scripts/prepare_desktop_release.py \
            --products releng/com.kide.repository/target/products

      - name: Upload update site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kide-p2-repository
          path: releng/com.kide.repository/target/repository
          if-no-files-found: warn
          retention-days: 14

      - name: Upload products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kide-products
          path: |
            releng/com.kide.repository/target/products/*.zip
            releng/com.kide.repository/target/products/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
