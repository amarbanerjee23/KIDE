# First-run defaults for the KIDE Modelling Studio.
# These are defaults only: anything a user changes afterwards wins.

org.eclipse.ui/defaultPerspectiveId=com.kide.branding.perspective
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP=true
org.eclipse.ui/DOCK_PERSPECTIVE_BAR=topRight
org.eclipse.ui/SHOW_TEXT_ON_PERSPECTIVE_BAR=true
org.eclipse.ui/SHOW_TRADITIONAL_STYLE_TABS=false
org.eclipse.ui/ENABLE_ANIMATIONS=false
org.eclipse.ui/SAVE_ALL_BEFORE_BUILD=true

org.eclipse.ui.editors/lineNumberRuler=true
org.eclipse.ui.editors/currentLine=true
org.eclipse.ui.editors/spacesForTabs=true
org.eclipse.ui.editors/tabWidth=2
org.eclipse.ui.editors/printMarginColumn=100

org.eclipse.core.resources/description.autobuilding=true
org.eclipse.core.resources/encoding=UTF-8

org.eclipse.sirius.ui/PREF_RELOADING_POLICY_MODE=always_reload
org.eclipse.sirius.diagram.ui/Pref_ENABLE_OVERRIDE=false
