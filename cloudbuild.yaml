steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Verify Artifact Registry repository
    entrypoint: bash
    args:
      - -ceu
      - |
        if ! gcloud artifacts repositories describe "${_AR_REPOSITORY}" \
            --project "${PROJECT_ID}" \
            --location "${_REGION}" >/dev/null 2>&1; then
          echo "Artifact Registry repository '${_AR_REPOSITORY}' does not exist in ${_REGION}." >&2
          echo "Run: PROJECT_ID=${PROJECT_ID} REGION=${_REGION} AR_REPOSITORY=${_AR_REPOSITORY} bash deploy/gcp/bootstrap-cloud-build.sh" >&2
          exit 2
        fi
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/gcp/Dockerfile
      - --tag
      - ${_KIDE_IMAGE}
      - --build-arg
      - KIDE_BUILD_QUALIFIER=${_KIDE_QUALIFIER}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_KIDE_IMAGE}
images:
  - ${_KIDE_IMAGE}
substitutions:
  _REGION: asia-south1
  _AR_REPOSITORY: kide
  _KIDE_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/kide:${BUILD_ID}'
  _KIDE_QUALIFIER: '${BUILD_ID}'
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
